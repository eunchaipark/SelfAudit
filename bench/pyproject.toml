# 실험 도구 (docs/설계/실험구조.md 1절). 실행 의존성은 없다(표준 라이브러리만).
# 개발 도구는 backend와 같은 것·같은 버전이라 새 라이브러리가 아니다(실험구조 1절, 5절 '공통 뼈대').
[project]
name = "selfaudit-bench"
version = "0.1.0"
description = "SelfAudit 실험 도구: 시험 번들·정답지, 실행기, 채점기 (REA 있음·없음 비교)"
requires-python = ">=3.13"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
# == 로 고정: backend uv.lock과 같은 버전이어야 두 프로젝트의 검사 결과가 같은 규칙에서 나온다
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-socket==0.8.1",
    "ruff==0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
# backend와 같은 묶음 (docs/코드규칙.md 9장). S: 보안 검사, DTZ: 시간대 없는 시각, PLW1514: 파일 인코딩, TID: 금지 import
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "DTZ", "PLW1514", "TID"]
ignore = ["RUF001", "RUF002", "RUF003", "S101", "N818"]  # 한국어 문장 부호, 테스트 assert, 오류 이름

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "N802"]  # 가짜 값, test_common_한글 이름

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# 바깥으로 나가는 것은 대상 에이전트(Claude Code)의 모델 호출뿐이다 (D-036, 보안규칙 '실험 예외')
"pickle".msg = "믿을 수 없는 데이터를 pickle로 읽지 않는다 (보안규칙 5장)"
"requests".msg = "실험 도구는 바깥 요청을 하지 않는다 (D-036)"
"urllib.request".msg = "실험 도구는 바깥 요청을 하지 않는다 (D-036)"
"http.client".msg = "실험 도구는 바깥 요청을 하지 않는다 (D-036)"
"socket".msg = "실험 도구는 바깥 요청을 하지 않는다 (D-036)"

[tool.mypy]
strict = true
python_version = "3.13"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# pytest-socket: 127.0.0.1 밖으로 접속 차단. Windows asyncio(실행기의 프로세스 대기)가 루프백 소켓 쌍을 쓴다
addopts = "-p no:cacheprovider --allow-hosts=127.0.0.1,::1"
